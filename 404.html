<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>서비스 점검 안내 | 리서치알음</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  /* 브랜드 가이드 §4 토큰 값 (homepage-frontend globals.css @theme 원천) */
  :root {
    --color-accent: #1877CC;
    --color-ink: #24384A;
    --bg-from: #F7FBFE;
    --bg-to: #E6F0F8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--color-ink);
    background: linear-gradient(180deg, var(--bg-from), var(--bg-to));
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    line-height: 1.6;
  }
  main {
    width: 100%; max-width: 480px; text-align: center;
    background: #fff; border-radius: 16px; padding: 40px 24px;
    box-shadow: 0 8px 32px rgba(36, 56, 74, .08);
  }
  .logo { width: 72px; height: 72px; }
  h1 { font-size: 26px; margin: 16px 0 12px; word-break: keep-all; }
  p { font-size: 15px; word-break: keep-all; }
  .contact {
    margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--bg-to);
    font-size: 15px;
  }
  .contact dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; max-width: 260px; margin: 12px auto 0; }
  .contact dt { opacity: .7; }
  a { color: var(--color-accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.svg" alt="리서치알음">
  <h1>서비스 점검 중입니다</h1>
  <p>현재 서비스 점검 중입니다.<br>이용에 불편을 드려 죄송합니다.</p>
  <div class="contact">
    <strong>문의</strong>
    <dl>
      <dt>대표전화</dt><dd><a href="tel:02-6405-9872">02-6405-9872</a></dd>
      <dt>이메일</dt><dd><a href="mailto:arum@researcharum.com">arum@researcharum.com</a></dd>
    </dl>
  </div>
</main>
</body>
</html>
