<svg viewBox="0 0 4096 4096" xmlns="http://www.w3.org/2000/svg">
  <!--
    원본 4096x4096 이미지를 픽셀 측정해 재현한 로고
    잘린 도넛을 마스크 없이 순수 path로 계산 → 어떤 렌더러/배경에서도
    빨간 링과의 겹침 부분과 도넛 구멍이 완전 투명
    여백 없이 로고만 쓰려면 viewBox="260 1000 3580 2100" 로 교체.
  -->

  <!-- 1) 잘린 파란 도넛 (단일 path)
       바깥 경계: r=1008 아크, 물린 부분: r=1065 오목 아크(교점 2072,1335.4 / 2072,2760.6)
       구멍: r=355 서브패스 (evenodd로 뚫림) -->
  <path fill="#1265A9" fill-rule="evenodd" d="
    M 2072 1335.4
    A 1008 1008 0 1 1 2072 2760.6
    A 1065 1065 0 0 0 2072 1335.4
    Z
    M 3140 2048
    A 355 355 0 1 0 2430 2048
    A 355 355 0 1 0 3140 2048
    Z"/>

  <!-- 2) 하늘색 렌즈: 오른쪽 경계 r=861 아크, 왼쪽 경계 r=1157 아크 -->
  <path fill="#3BADEB" d="M 1771.6 1375.5
    A 861 861 0 0 1 1771.6 2720.5
    A 1157 1157 0 0 1 1771.6 1375.5 Z"/>

  <!-- 3) 빨간 링: 중심 (1280.5,2048), 중심선 r=940, 두께 77 -->
  <circle cx="1280.5" cy="2048" r="940" fill="none" stroke="#FF4244" stroke-width="77"/>
</svg>
